name = "learn-gaitherstephens"
main = "src/worker.js"
compatibility_date = "2026-01-28"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "learn.gaitherstephens.com", custom_domain = true }
]
# The workers.dev host must STAY enabled: CI assurance scans hit
# learn-gaitherstephens.gaitherstephens.workers.dev because the zone's
# bot challenge blocks GH runners (a0bb391). wrangler 4 disables it by
# default when unset, which a 2026-08-01 deploy proved the hard way.
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "learn-db"
database_id = "f1bf3d0a-a92e-4e1f-a2a8-fb02e62c494a"

# External D1 backup target (STD-22): weekly dump of learn-db, resumable,
# manifest-gated. Bucket is learn's own; house/recipes each use their own too.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "learn-gaitherstephens-backups"

# Weekly D1 -> R2 backup, Monday 09:00 UTC (house digest+backup = Mon 11/12
# UTC, gaithernews backup = Sun 04:00-06:45 UTC; this slot collides with
# neither). Handler: scheduled() in src/worker.js.
[triggers]
# Day-of-week by NAME: Cloudflare cron numbers day-of-week from SUNDAY=1,
# so "* * 1" fired Sundays, not Mondays (same bug as house, fixed 2026-08-03).
crons = ["0 9 * * MON"]

[vars]
APP_NAME = "FTCE Science 5-9 Study"
SITE_URL = "https://learn.gaitherstephens.com"
# Shared assurance collector: the weekly backup reports its freshness here
# (data / backup:learn) so a stalled backup shows on /admin/health instead of
# failing silently (STD-23). OPS_TOKEN is a secret, set via wrangler secret put.
# CUSTOM DOMAIN, not workers.dev (2026-08-13). The workers.dev target
# silently ate every CRON report: the Mon Aug 10 09:00 backup COMPLETED
# (manifest written at 09:00:45) but its tile never arrived, so the
# health board showed "stopped reporting" for 9 days over a backup that
# was fine. The 08-04 gotcha note assumed scheduled context could reach
# a sibling workers.dev host; it cannot. Manual runs reported fine
# because they arrive via the custom domain. Same-account workers.dev
# to workers.dev fetch fails in EVERY context; always target the
# custom domain.
OPS_INGEST_URL = "https://gaithernews.com/run-assurance-ingest"
