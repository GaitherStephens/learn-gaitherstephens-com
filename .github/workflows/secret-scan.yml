# Secret scanning, BLOCKING (network standard, SECURITY_BASELINE.md
# section 9). Added 2026-09-11 after the health board's secret-scan
# coverage check (a real check now, not a hand-written row) found this
# repo without it; the full history was scanned clean before the gate went
# in. Runs the pinned gitleaks binary directly (gitleaks-action needs an
# org license; the binary does not). Allowlist, where one exists, lives in
# .gitleaks.toml next to this file's repo root.
name: secret-scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Run gitleaks (blocking)
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --redact=100 --exit-code 1 \
            --report-format json --report-path gitleaks-report.json
          COUNT=$(python3 -c "import json;print(len(json.load(open('gitleaks-report.json'))))")
          echo "gitleaks findings: $COUNT (blocking; values redacted)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 90
